name: N5105 (x86_64) with ImageBuilder

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: 'ImmortalWrt Version'
        required: true
        default: '24.10.6'
        type: choice
        options:
          - 23.05.4
          - 23.05.5
          - 23.05.6
          - 23.05.7
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6

env:
  DIY_SCRIPT: "diyX86.sh"
  CUSTOM_FILES_DIR: "custom-files"
  CUSTOM_PACKAGES_DIR: "custom-packages"
  PACKAGES_LIST_FILE: "packagesX86.txt"
  BUILDER_DIR: "openwrt"

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build for N5105 (x86_64)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Swap File
        run: |
          if [ -z "$(swapon --show=NAME --noheadings)" ]; then
            echo "⚡ Creating 4G swap..."
            sudo fallocate -l 4G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
            echo "✅ Swap enabled"
          else
            echo "ℹ️ Swap already active"
          fi
          free -h

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses5-dev gawk git subversion \
            libssl-dev gettext unzip zlib1g-dev wget file zstd qemu-utils xz-utils curl perl coreutils

      - name: Download & Extract ImmortalWrt ImageBuilder
        run: |
          VERSION="${{ inputs.immortalwrt_version }}"
          BASE_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/x86/64"

          # 23.05 使用 tar.xz，24.10+ 使用 tar.zst (若遇 404 可微调)
          [[ "$VERSION" == "23.05."* ]] && EXT="tar.xz" || EXT="tar.zst"

          BUILDER_URL="${BASE_URL}/immortalwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.${EXT}"
          echo "📥 Downloading: $BUILDER_URL"
          wget -q --show-progress "$BUILDER_URL" -O "imagebuilder.${EXT}"

          if [[ "$EXT" == "tar.zst" ]]; then
            tar --use-compress-program=unzstd -xf "imagebuilder.${EXT}"
          else
            tar -xf "imagebuilder.${EXT}"
          fi
          
          mv immortalwrt-imagebuilder-*-x86-64.Linux-x86_64 "${{ env.BUILDER_DIR }}"

          if [ ! -d "${{ env.BUILDER_DIR }}" ]; then
            echo "❌ ImageBuilder extraction failed!" && exit 1
          fi
          echo "✅ ImageBuilder ready at ./${{ env.BUILDER_DIR }}"

      - name: Execute DIY Script
        run: |
          if [ -f "${{ env.DIY_SCRIPT }}" ]; then
            echo "🔧 Executing ${{ env.DIY_SCRIPT }}..."
            chmod +x "${{ env.DIY_SCRIPT }}"
            cd "${{ env.BUILDER_DIR }}"
            "../${{ env.DIY_SCRIPT }}"
            echo "✅ DIY script completed"
          else
            echo "⏭️ ${{ env.DIY_SCRIPT }} not found, skipping"
          fi

      - name: Inject Custom Files & Packages
        run: |
          echo "📦 Injecting custom resources..."
          BUILDER_FILES="${{ env.BUILDER_DIR }}/files"
          mkdir -p "$BUILDER_FILES" "${{ env.BUILDER_DIR }}/packages"

          # 1. 注入自定义文件并修复权限
          if [ -d "${{ env.CUSTOM_FILES_DIR }}" ] && [ "$(ls -A "${{ env.CUSTOM_FILES_DIR }}" 2>/dev/null)" ]; then
            cp -rv "${{ env.CUSTOM_FILES_DIR }}"/* "$BUILDER_FILES/"

            echo "🔐 Fixing permissions for ALL injected init.d scripts..."
            find "$BUILDER_FILES/etc/init.d" -type f -exec chmod +x {} \; 2>/dev/null || true
          else
            echo "⏭️ No custom files to inject"
          fi

          # 2. 注入自定义 IPK
          if [ -d "${{ env.CUSTOM_PACKAGES_DIR }}" ] && find "${{ env.CUSTOM_PACKAGES_DIR }}" -name "*.ipk" -print -quit | grep -q .; then
            cp -v "${{ env.CUSTOM_PACKAGES_DIR }}"/*.ipk "${{ env.BUILDER_DIR }}/packages/"
            echo "✅ Custom IPKs injected"
          else
            echo "⏭️ No custom IPKs found"
          fi

          # 3. 通用权限修复
          find "$BUILDER_FILES/usr/bin" "$BUILDER_FILES/etc/sh" -type f -exec chmod +x {} \; 2>/dev/null || true
          [ -f "$BUILDER_FILES/etc/rc.local" ] && chmod +x "$BUILDER_FILES/etc/rc.local"
          [ -d "$BUILDER_FILES/etc/dropbear" ] && chmod 700 "$BUILDER_FILES/etc/dropbear"
          find "$BUILDER_FILES/etc/dropbear" -type f -exec chmod 600 {} \; 2>/dev/null || true

          echo "✅ Injection completed"

      - name: Build SquashFS Firmware with ImageBuilder
        run: |
          cd "${{ env.BUILDER_DIR }}"

          # sha256 兼容处理
          command -v sha256 &>/dev/null || sudo ln -sf "$(command -v sha256sum)" /usr/local/bin/sha256

          # 强制指定 SquashFS 格式 (关闭 ext4，开启 squashfs)
          sed -i 's/CONFIG_TARGET_ROOTFS_EXT4FS=y/CONFIG_TARGET_ROOTFS_EXT4FS=n/g' .config
          sed -i 's/# CONFIG_TARGET_ROOTFS_SQUASHFS is not set/CONFIG_TARGET_ROOTFS_SQUASHFS=y/g' .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "✅ Forced SquashFS rootfs"

          # 读取包列表（过滤注释和空行）
          PACKAGES=""
          if [ -f "../${{ env.PACKAGES_LIST_FILE }}" ]; then
            PACKAGES=$(grep -vE '^\s*#|^\s*$' "../${{ env.PACKAGES_LIST_FILE }}" | tr '\n' ' ')
            echo "📋 Packages from ${{ env.PACKAGES_LIST_FILE }}: $(echo $PACKAGES | wc -w) items"
          else
            echo "⏭️ ${{ env.PACKAGES_LIST_FILE }} not found, building with defaults"
          fi

          echo "🚀 Starting ImageBuilder for x86_64..."
          make image PROFILE=generic \
            FILES="files" \
            ROOTFS_PARTSIZE=2048 \
            EXTRA_IMAGE_NAME="n5105" \
            PACKAGES="$PACKAGES" \
            V=s

      - name: Upload Firmware to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IWrt-${{ inputs.immortalwrt_version }}-N5105-squashfs
          path: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*-n5105.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.manifest

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: n5105-${{ inputs.immortalwrt_version }}-build${{ github.run_number }}
          name: N5105 x86_64 ${{ inputs.immortalwrt_version }} (Build ${{ github.run_number }})
          body: |
            ## ImmortalWrt Firmware (N5105 / x86_64)

            | Item | Value |
            |------|-------|
            | Version | `${{ inputs.immortalwrt_version }}` |
            | Architecture | `x86_64` |
            | RootFS | `SquashFS` |

            ### ⚠️ Flash Instructions
            1. **PVE 虚拟机**: 解压 `.img.gz` 得到 `.img`，使用 `qm importdisk` 导入。
            2. **物理机 U盘启动**: 使用 Rufus (DD模式) 或 balenaEtcher 将解压后的 `.img` 写入 U盘。
            3. **物理机 直写硬盘**: 在 PE 或 LiveCD 下使用 `dd` 或 `DiskGenius` 将 `.img` 写入 N5105 内置硬盘。
            
            ### 🔧 N5105 Notes
            - 默认生成 `combined-efi.img.gz` (支持 UEFI 启动) 和 `combined.img.gz` (Legacy BIOS)。N5105 请使用 **efi** 版本。
            - SquashFS 格式支持在 LuCI 中“恢复出厂设置”（Reset to defaults）。
          files: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*-n5105.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.manifest
