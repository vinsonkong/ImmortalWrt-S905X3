name: Build ImmortalWrt JCG Q30

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: 'ImmortalWrt Version'
        required: true
        default: '23.05.7'
        type: choice
        options:
          - 23.05.4
          - 23.05.5
          - 23.05.6
          - 23.05.7
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      target_profile:
        description: 'Target Profile (Device)'
        required: true
        default: 'jcg_q30'

# ✅ 统一在此处定义自定义资源路径变量
env:
  CUSTOM_FILES_DIR: "custom-filesjcq"
  CUSTOM_PACKAGES_DIR: "custom-packagesjcq"
  PACKAGES_LIST_FILE: "packagesjcq.txt"
  DIY_SCRIPT: "diyjcq.sh"

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build ImmortalWrt for ${{ inputs.target_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Swap File
        run: |
          if [ -z "$(swapon --show=NAME --noheadings)" ]; then
            echo "Creating 4G swap..."
            sudo fallocate -l 4G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses5-dev gawk git subversion \
            libssl-dev gettext unzip zlib1g-dev wget file zstd xz-utils curl perl coreutils

      - name: Download & Extract ImmortalWrt ImageBuilder
        run: |
          VERSION=${{ inputs.immortalwrt_version }}
          # ✅ ImmortalWrt 下载地址与命名规则
          BASE_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/mediatek/filogic"
          
          # ImmortalWrt 24.10+ 使用 .tar.zst，23.05 使用 .tar.xz
          if [[ "$VERSION" == "24."* ]]; then
            EXT="tar.zst"
          else
            EXT="tar.xz"
          fi
          
          # ✅ ImmortalWrt ImageBuilder 文件名前缀为 immortalwrt-imagebuilder
          BUILDER_URL="${BASE_URL}/immortalwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.${EXT}"
          echo "Downloading: $BUILDER_URL"
          wget -q "$BUILDER_URL" -O "imagebuilder.${EXT}"
          
          if [[ "$EXT" == "tar.zst" ]]; then
            tar --use-compress-program=unzstd -xf "imagebuilder.${EXT}"
          else
            tar -xf "imagebuilder.${EXT}"
          fi
          
          mv immortalwrt-imagebuilder-*-mediatek-filogic.Linux-x86_64 openwrt

      - name: Execute DIY Script
        run: |
          if [ -f "./${{ env.DIY_SCRIPT }}" ]; then
            echo "🔧 开始执行 ${{ env.DIY_SCRIPT }} 二进制注入..."
            chmod +x "./${{ env.DIY_SCRIPT }}"
            cd openwrt
            "../${{ env.DIY_SCRIPT }}"
            cd ..
            echo "✅ ${{ env.DIY_SCRIPT }} 执行完毕"
          else
            echo "⚠️ 未找到 ${{ env.DIY_SCRIPT }}，跳过"
          fi

      - name: Inject Custom Files & Packages
        run: |
          echo "📦 开始注入自定义文件与包..."
          echo "📂 文件目录: ${{ env.CUSTOM_FILES_DIR }}"
          echo "📦 插件目录: ${{ env.CUSTOM_PACKAGES_DIR }}"
          
          # 1. 处理自定义 ipk 包
          mkdir -p ./openwrt/packages
          if [ -d "./${{ env.CUSTOM_PACKAGES_DIR }}" ] && ls ./${{ env.CUSTOM_PACKAGES_DIR }}/*.ipk 1>/dev/null 2>&1; then
            cp ./${{ env.CUSTOM_PACKAGES_DIR }}/*.ipk ./openwrt/packages/
            echo "✅ 自定义 ipk 已复制到 openwrt/packages/"
          else
            echo "⚠️ 无 ${{ env.CUSTOM_PACKAGES_DIR }} 或无 ipk 文件，跳过"
          fi
          
          # 2. 处理自定义文件
          mkdir -p ./openwrt/files
          if [ -d "./${{ env.CUSTOM_FILES_DIR }}" ] && [ "$(ls -A ./${{ env.CUSTOM_FILES_DIR }} 2>/dev/null)" ]; then
            cp -r ./${{ env.CUSTOM_FILES_DIR }}/* ./openwrt/files/
            echo "✅ ${{ env.CUSTOM_FILES_DIR }} 已注入"
          else
            echo "⚠️ 无 ${{ env.CUSTOM_FILES_DIR }} 或目录为空，跳过"
          fi
          
          echo "🔐 设置文件权限..."
          find ./openwrt/files -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          chmod -R +x ./openwrt/files/etc/init.d 2>/dev/null || true
          chmod -R +x ./openwrt/files/etc/uci-defaults 2>/dev/null || true
          chmod -R +x ./openwrt/files/etc/sh 2>/dev/null || true
          chmod 700 ./openwrt/files/etc/dropbear 2>/dev/null || true
          chmod 600 ./openwrt/files/etc/dropbear/* 2>/dev/null || true
          
          echo "✅ 注入完成"

      - name: Build Firmware with Custom Config
        run: |
          cd openwrt
          
          # ✅ 核心：自动探测并匹配正确的 Profile 名称（兼容 ImmortalWrt 命名）
          INPUT_PROFILE="${{ inputs.target_profile }}"
          FINAL_PROFILE=""
          
          echo "🔍 正在验证 Profile: $INPUT_PROFILE ..."
          if make info | grep -q "^$INPUT_PROFILE:"; then
            FINAL_PROFILE="$INPUT_PROFILE"
            echo "✅ 精确匹配成功: $FINAL_PROFILE"
          else
            echo "⚠️ 精确匹配失败，尝试模糊搜索包含 '$INPUT_PROFILE' 的 Profile..."
            # ImmortalWrt 常见变体：jcg_q30-pro, jcg_q30-ubootmod, jcg-q30-pro
            MATCHED=$(make info | grep -iE "^${INPUT_PROFILE}(-pro|-ubootmod)?" | head -n 1 | cut -d':' -f1)
            if [ -n "$MATCHED" ]; then
              FINAL_PROFILE="$MATCHED"
              echo "✅ 模糊匹配成功，实际使用 Profile: $FINAL_PROFILE"
            else
              echo "❌ 致命错误：在当前 ImmortalWrt ImageBuilder 中找不到任何与 '$INPUT_PROFILE' 相关的设备！"
              echo "📋 当前可用的所有 mediatek/filogic Profile 列表："
              make info | grep -E "^[a-zA-Z0-9_-]+:" || true
              exit 1
            fi
          fi
          
          # 读取包列表
          PACKAGES_LIST=""
          if [ -f "../${{ env.PACKAGES_LIST_FILE }}" ]; then
            while IFS= read -r line; do
              case "$line" in \#*|"") continue ;; esac
              PACKAGES_LIST="$PACKAGES_LIST $line"
            done < "../${{ env.PACKAGES_LIST_FILE }}"
            echo "📋 从 ${{ env.PACKAGES_LIST_FILE }} 读取包列表"
          else
            # ImmortalWrt 默认已包含较多中文组件，此处仅补充基础工具
            PACKAGES_LIST="luci luci-app-ttyd curl wget"
            echo "⚠️ 未找到 ${{ env.PACKAGES_LIST_FILE }}，使用默认包列表"
          fi
          
          echo "📦 opkg 将安装: $(echo $PACKAGES_LIST | wc -w) 个包"
          echo "🚀 开始编译固件..."
          
          make image PROFILE="$FINAL_PROFILE" FILES="files" PACKAGES="$PACKAGES_LIST" V=s

      - name: Upload Firmware to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ inputs.immortalwrt_version }}-${{ inputs.target_profile }}
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: iwrt-${{ inputs.target_profile }}-${{ inputs.immortalwrt_version }}-build${{ github.run_number }}
          name: ImmortalWrt JCG Q30 ${{ inputs.immortalwrt_version }} (Build ${{ github.run_number }})
          body: |
            ImmortalWrt 固件 (JCG Q30 Pro)
            - 版本: ${{ inputs.immortalwrt_version }}
            - 设备: ${{ inputs.target_profile }}
            
            ### 📁 自定义内容
            - DIY脚本: ${{ env.DIY_SCRIPT }}
            - 自定义文件: ${{ env.CUSTOM_FILES_DIR }}
            - 自定义插件: ${{ env.CUSTOM_PACKAGES_DIR }}
            - 包列表: ${{ env.PACKAGES_LIST_FILE }}
            - 📂 `/etc/sh/` 目录下的脚本已自动赋予可执行权限
            
            ### ⚠️ 刷机提示
            1. 请使用 U-Boot 网页端或 Breed 刷入 `sysupgrade.bin`。
            2. ImmortalWrt 默认 IP 通常为 192.168.1.1，密码为 password。
            3. 若需保留配置，请在后台“备份/升级”页面勾选“保留配置”。
          files: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
