name: Build OpenWrt JCG Q30

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version'
        required: true
        default: '23.05.5'
        type: choice
        options:
          - 23.05.4
          - 23.05.5
          - 23.05.6
          - 24.10.0
          - 24.10.1
          - 24.10.2
      target_profile:
        description: 'Target Profile (Device)'
        required: true
        default: 'jcg_q30'

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build for ${{ inputs.target_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Swap File
        run: |
          if [ -z "$(swapon --show=NAME --noheadings)" ]; then
            echo "Creating 4G swap..."
            sudo fallocate -l 4G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses5-dev gawk git subversion \
            libssl-dev gettext unzip zlib1g-dev wget file zstd xz-utils curl perl coreutils

      - name: Download & Extract OpenWrt ImageBuilder
        run: |
          VERSION=${{ inputs.openwrt_version }}
          BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/mediatek/filogic"
          
          # OpenWrt 24.10+ 使用 .tar.zst，旧版本使用 .tar.xz
          if [[ "$VERSION" == "24."* ]]; then
            EXT="tar.zst"
          else
            EXT="tar.xz"
          fi
          
          BUILDER_URL="${BASE_URL}/openwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.${EXT}"
          echo "Downloading: $BUILDER_URL"
          wget -q "$BUILDER_URL" -O "imagebuilder.${EXT}"
          
          if [[ "$EXT" == "tar.zst" ]]; then
            tar --use-compress-program=unzstd -xf "imagebuilder.${EXT}"
          else
            tar -xf "imagebuilder.${EXT}"
          fi
          
          mv openwrt-imagebuilder-*-mediatek-filogic.Linux-x86_64 openwrt

      - name: Execute diy.sh for Binary Injection
        run: |
          if [ -f "./diy.sh" ]; then
            echo "🔧 开始执行 diy.sh 二进制注入..."
            chmod +x ./diy.sh
            cd openwrt
            ../diy.sh
            cd ..
            echo "✅ diy.sh 执行完毕"
          else
            echo "⚠️ 未找到 diy.sh，跳过"
          fi

      - name: Inject Custom Files & Packages
        run: |
          echo "📦 开始注入自定义文件与包..."
          
          # 1. 处理自定义 ipk 包
          mkdir -p ./openwrt/packages
          if ls ./custom-packages/*.ipk 1>/dev/null 2>&1; then
            cp ./custom-packages/*.ipk ./openwrt/packages/
            echo "✅ 自定义 ipk 已复制到 openwrt/packages/"
          else
            echo "⚠️ 无自定义 ipk，跳过"
          fi
          
          # 2. 处理自定义文件 (custom-files)
          mkdir -p ./openwrt/files
          if [ -d "./custom-files" ] && [ "$(ls -A ./custom-files 2>/dev/null)" ]; then
            cp -r ./custom-files/* ./openwrt/files/
            echo "✅ custom-files 已注入"
          else
            echo "⚠️ 无 custom-files，跳过"
          fi
          
          echo "🔐 设置文件权限..."
          # 自动给所有 .sh 文件加执行权限
          find ./openwrt/files -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          
          # 给特定的系统脚本目录加执行权限
          chmod -R +x ./openwrt/files/etc/init.d 2>/dev/null || true
          chmod -R +x ./openwrt/files/etc/uci-defaults 2>/dev/null || true
          chmod -R +x ./openwrt/files/etc/sh 2>/dev/null || true  # 专门为您指定的 /etc/sh 目录赋权
          
          # 保护 SSH 密钥权限
          chmod 700 ./openwrt/files/etc/dropbear 2>/dev/null || true
          chmod 600 ./openwrt/files/etc/dropbear/* 2>/dev/null || true
          
          echo "✅ 注入完成"

      - name: Build Firmware with Custom Config
        run: |
          cd openwrt
          
          # 读取 packages.txt (如果存在)
          PACKAGES_LIST=""
          if [ -f "../packages.txt" ]; then
            while IFS= read -r line; do
              case "$line" in \#*|"") continue ;; esac
              PACKAGES_LIST="$PACKAGES_LIST $line"
            done < ../packages.txt
          else
            # 默认预装基础包
            PACKAGES_LIST="luci luci-app-ttyd curl wget"
          fi
          
          echo "📦 opkg 将安装: $(echo $PACKAGES_LIST | wc -w) 个包"
          echo "📋 包列表: $PACKAGES_LIST"
          
          # 构建固件
          make image PROFILE=${{ inputs.target_profile }} FILES="files" PACKAGES="$PACKAGES_LIST" V=s

      - name: Upload Firmware to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ inputs.openwrt_version }}-${{ inputs.target_profile }}
          path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.target_profile }}-${{ inputs.openwrt_version }}-build${{ github.run_number }}
          name: JCG Q30 ${{ inputs.openwrt_version }} (Build ${{ github.run_number }})
          body: |
            OpenWrt 固件 (JCG Q30 Pro)
            - 版本: ${{ inputs.openwrt_version }}
            - 设备: ${{ inputs.target_profile }}
            
            ### 📁 自定义内容
            - diy.sh: 若存在则已执行
            - custom-files: 已注入并覆盖系统同名文件
            - custom-packages: 由 ImageBuilder 原生 opkg 机制安装
            - 📂 `/etc/sh/` 目录下的脚本已自动赋予可执行权限
            
            ### ⚠️ 刷机提示
            1. 请使用 U-Boot 网页端或 Breed 刷入 `sysupgrade.bin`。
            2. 若需保留配置，请在后台“备份/升级”页面勾选“保留配置”。
          files: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
