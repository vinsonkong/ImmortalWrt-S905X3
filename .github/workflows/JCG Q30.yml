name: Build ImmortalWrt JCG Q30

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: 'ImmortalWrt Version'
        required: true
        default: '23.05.7'
        type: choice
        options:
          - 23.05.4
          - 23.05.5
          - 23.05.6
          - 23.05.7
          - 24.10.0
          - 24.10.1
          - 24.10.2
      target_profile:
        description: 'Target Profile (Device)'
        required: true
        default: 'jcg_q30-ubootmod'
        type: choice
        options:
          - jcg_q30-ubootmod
          - jcg_q30

env:
  BUILDER_DIR: "openwrt"
  CUSTOM_FILES_DIR: "custom-filesjcq"
  CUSTOM_PACKAGES_DIR: "custom-packages"
  PACKAGES_LIST_FILE: "packagesjcq.txt"
  DIY_SCRIPT: "diyjcq.sh"
  DEFAULT_IP: "192.168.2.254"

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build ImmortalWrt for ${{ inputs.target_profile }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Swap File
        run: |
          if [ -z "$(swapon --show=NAME --noheadings)" ]; then
            echo "⚡ Creating 4G swap..."
            sudo fallocate -l 4G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
            echo "✅ Swap enabled"
          else
            echo "ℹ️ Swap already active"
          fi
          free -h

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses5-dev gawk git subversion \
            libssl-dev gettext unzip zlib1g-dev wget file zstd xz-utils curl perl coreutils

      - name: Download & Extract ImmortalWrt ImageBuilder
        run: |
          VERSION="${{ inputs.immortalwrt_version }}"
          BASE_URL="https://downloads.immortalwrt.org/releases/${VERSION}/targets/mediatek/filogic"

          [[ "$VERSION" == "24."* ]] && EXT="tar.zst" || EXT="tar.xz"

          BUILDER_URL="${BASE_URL}/immortalwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.${EXT}"
          echo "📥 Downloading: ${BUILDER_URL}"
          wget -q --show-progress "${BUILDER_URL}" -O "imagebuilder.${EXT}"

          if [[ "$EXT" == "tar.zst" ]]; then
            tar --use-compress-program=unzstd -xf "imagebuilder.${EXT}"
          else
            tar -xf "imagebuilder.${EXT}"
          fi

          mv immortalwrt-imagebuilder-*-mediatek-filogic.Linux-x86_64 "${{ env.BUILDER_DIR }}"

          if [ ! -d "${{ env.BUILDER_DIR }}" ]; then
            echo "❌ ImageBuilder extraction failed!" && exit 1
          fi
          echo "✅ ImageBuilder ready at ./${{ env.BUILDER_DIR }}"

      - name: Execute DIY Script
        run: |
          if [ -f "${{ env.DIY_SCRIPT }}" ]; then
            echo "🔧 Executing ${{ env.DIY_SCRIPT }}..."
            chmod +x "${{ env.DIY_SCRIPT }}"
            cd "${{ env.BUILDER_DIR }}"
            "../${{ env.DIY_SCRIPT }}"
            echo "✅ DIY script completed"
          else
            echo "⏭️ ${{ env.DIY_SCRIPT }} not found, skipping"
          fi

      - name: Inject Custom Files & Packages
        run: |
          echo "📦 Injecting custom resources..."
          BUILDER_FILES="${{ env.BUILDER_DIR }}/files"
          mkdir -p "$BUILDER_FILES" "${{ env.BUILDER_DIR }}/packages"

          # 1. 注入自定义文件并修复权限
          if [ -d "${{ env.CUSTOM_FILES_DIR }}" ] && [ "$(ls -A "${{ env.CUSTOM_FILES_DIR }}" 2>/dev/null)" ]; then
            cp -rv "${{ env.CUSTOM_FILES_DIR }}"/* "$BUILDER_FILES/"

            echo "🔐 Fixing permissions for ALL injected init.d scripts..."
            find "$BUILDER_FILES/etc/init.d" -type f -exec chmod +x {} \; 2>/dev/null || true

            if [ -f "$BUILDER_FILES/etc/init.d/easytier" ]; then
              echo "✅ easytier found and marked executable"
            else
              echo "⚠️ easytier not found in injected files! Please check repo path structure."
            fi
          else
            echo "⏭️ No custom files to inject"
          fi

          # 2. 注入自定义 IPK
          if [ -d "${{ env.CUSTOM_PACKAGES_DIR }}" ] && find "${{ env.CUSTOM_PACKAGES_DIR }}" -name "*.ipk" -print -quit | grep -q .; then
            cp -v "${{ env.CUSTOM_PACKAGES_DIR }}"/*.ipk "${{ env.BUILDER_DIR }}/packages/"
            echo "✅ Custom IPKs injected"
          else
            echo "⏭️ No custom IPKs found"
          fi

          # 3. 通用权限修复
          find "$BUILDER_FILES/usr/bin" "$BUILDER_FILES/etc/sh" -type f -exec chmod +x {} \; 2>/dev/null || true
          [ -f "$BUILDER_FILES/etc/rc.local" ] && chmod +x "$BUILDER_FILES/etc/rc.local"
          [ -d "$BUILDER_FILES/etc/dropbear" ] && chmod 700 "$BUILDER_FILES/etc/dropbear"
          find "$BUILDER_FILES/etc/dropbear" -type f -exec chmod 600 {} \; 2>/dev/null || true

          echo "✅ Injection completed"

      - name: Build Firmware with ImageBuilder
        run: |
          cd "${{ env.BUILDER_DIR }}"

          # sha256 兼容处理
          command -v sha256 &>/dev/null || sudo ln -sf "$(command -v sha256sum)" /usr/local/bin/sha256

          # Profile 智能匹配
          INPUT_PROFILE="${{ inputs.target_profile }}"
          INFO_FILE="/tmp/ib_profiles.txt"
          make info > "$INFO_FILE" 2>&1 || true

          if grep -q "^${INPUT_PROFILE}:" "$INFO_FILE"; then
            FINAL_PROFILE="$INPUT_PROFILE"
          else
            FINAL_PROFILE=$(grep -iE "^${INPUT_PROFILE}(-pro|-ubootmod)?" "$INFO_FILE" | head -n 1 | cut -d':' -f1)
          fi
          rm -f "$INFO_FILE"

          if [ -z "$FINAL_PROFILE" ]; then
            echo "❌ Profile not found: $INPUT_PROFILE"
            exit 1
          fi
          echo "✅ Using Profile: $FINAL_PROFILE"

          # 读取包列表
          PACKAGES=""
          if [ -f "../${{ env.PACKAGES_LIST_FILE }}" ]; then
            PACKAGES=$(grep -vE '^\s*#|^\s*$' "../${{ env.PACKAGES_LIST_FILE }}" | tr '\n' ' ')
            echo "📋 Packages from ${{ env.PACKAGES_LIST_FILE }}: $(echo $PACKAGES | wc -w) items"
          else
            echo "⏭️ ${{ env.PACKAGES_LIST_FILE }} not found, building with defaults"
          fi

          echo "🚀 Starting ImageBuilder..."
          make image PROFILE="$FINAL_PROFILE" \
            FILES="files" \
            PACKAGES="$PACKAGES" \
            V=s

      - name: Diagnose Build Output
        if: always()
        run: |
          echo "🔍 Checking build artifacts..."
          FIRMWARE_DIR="${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic"

          if [ -d "$FIRMWARE_DIR" ]; then
            echo "📂 Directory contents:"
            ls -lah "$FIRMWARE_DIR/"

            FIRMWARE_COUNT=$(find "$FIRMWARE_DIR" $ -name "*.bin" -o -name "*.itb" -o -name "*.fip" $ 2>/dev/null | wc -l)
            echo "📊 Firmware files (bin/itb/fip): $FIRMWARE_COUNT"

            if [ "$FIRMWARE_COUNT" -eq 0 ]; then
              echo "⚠️ No firmware files found! Check the Build step logs above."
            else
              echo "✅ Firmware generated successfully!"
            fi
          else
            echo "❌ Firmware output directory missing. Build likely failed early."
          fi

      - name: Upload Firmware to Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ inputs.immortalwrt_version }}-${{ inputs.target_profile }}
          path: |
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*.itb
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*-bl31-uboot.fip
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*.manifest

      - name: Upload Firmware to Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: iwrt-${{ inputs.target_profile }}-${{ inputs.immortalwrt_version }}-build${{ github.run_number }}
          name: ImmortalWrt JCG Q30 ${{ inputs.immortalwrt_version }} (Build ${{ github.run_number }})
          body: |
            ## ImmortalWrt Firmware (JCG Q30 Pro / MT7981B)

            | Item | Value |
            |------|-------|
            | Version | `${{ inputs.immortalwrt_version }}` |
            | Profile | `${{ inputs.target_profile }}` |
            | Default IP | `${{ env.DEFAULT_IP }}` |

            ### 📁 Custom Resources
            - DIY Script: `${{ env.DIY_SCRIPT }}`
            - Custom Files: `${{ env.CUSTOM_FILES_DIR }}`
            - Custom Packages: `${{ env.CUSTOM_PACKAGES_DIR }}`
            - Package List: `${{ env.PACKAGES_LIST_FILE }}`

            ### ⚠️ Flash Instructions
            1. **Sysupgrade (系统内升级)**: Use `*-sysupgrade.itb`
            2. **First Flash / Unbrick**: Use `preloader.bin` + `*-bl31-uboot.fip` + `*-sysupgrade.itb` via MTK Flash Tool or TFTP
            3. Default IP: `${{ env.DEFAULT_IP }}` / Password: `password`

            ### 🔧 MT7981B Notes
            - If using `24.10.x`, ensure your U-Boot matches the ubootmod layout
            - DTS overlay issues? Check `/lib/firmware/mediatek/` for mt7981 WiFi firmware
            - For NAND flash devices, always use `.itb` format for sysupgrade
          files: |
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*.bin
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*.itb
            ${{ env.BUILDER_DIR }}/bin/targets/mediatek/filogic/*-bl31-uboot.fip
