# ==================== 文件与目录 ====================
music_directory     "/mnt/nvme0n1p3/music"
playlist_directory  "/mnt/nvme0n1p3/tools/mpd/playlists"
db_file             "/mnt/nvme0n1p3/tools/mpd/database"
state_file          "/mnt/nvme0n1p3/tools/mpd/state"
log_file            "/tmp/mpd/log"


user              "root"
group             "root"

# ==================== 网络监听 ====================
bind_to_address "0.0.0.0"
port "6600"

# ==================== 音频输出 (PulseAudio) ====================
audio_output {
    type            "pulse"
    name            "PulseAudio Bluetooth"
    # server          "127.0.0.1"
    # sink "bluez_sink.BB_F0_24_A6_CD_4C.a2dp_sink"
    # buffer_time     "500000"
    # mixer_type      "software"
    # format          "44100:16:2"
}

# ==================== 通用选项 ====================
auto_update         "yes"
filesystem_charset  "UTF-8"
metadata_to_use     "Artist,Album,Title,Track,Date,Genre"
log_level           "notice"     
restore_paused      "yes"          
# 重启后不自动播放，避免蓝牙未就绪时爆音
save_absolute_paths_in_playlists "no"

# ==================== 输入插件 ====================
input {
    plugin          "curl"
}
