<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title></title>
    <link rel="stylesheet" href="../assets/css/webguide.css">

</head>

<body>
    <div id="main">
        <div class="topbar">
            <div class="right">
                 <a href="../addr/index.html" style="color: white">addr
                 </a>           
                 <a href="javascript:void(0);" id="manage-button" class="user-button">
                     <i class="fas fa-edit"></i> 管理网址
                 </a>                
            </div>
            <div class="left">
                 <a href="javascript:void(0);" id="add-button" class="user-button">
                     <i class="fas fa-plus"></i> 添加网址
                 </a>         
            </div>
            <a href="../#private" style="color: white">
            <div class="middle title"></div></a>
        </div>


        <div class="content">
            <div class="grid"></div>
        </div>
        <div class="footerbar">
            <div class="grid"></div>
        </div>
    </div>
    
    <!-- 编辑模态框 -->
    <div id="edit-modal">
        <div class="edit-form">
            <div class="edit-form-header">
                <span>编辑网址</span>
                <button class="delete-btn">删除</button>
            </div>
            <div class="edit-form-content">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="edit-txt" placeholder="网址名称">
                </div>
                <div class="form-group">
                    <label>外网URL</label>
                    <input type="text" id="edit-url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>内网URL</label>
                    <input type="text" id="edit-purl" placeholder="http://内网地址...">
                </div>
            </div>
            <div class="edit-form-footer">
                <button class="form-button cancel-btn">取消</button>
                <button class="form-button submit-btn">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 添加模态框 -->
    <div id="add-modal">
        <div class="add-form">
            <div class="add-form-header">
                <span>添加新网址</span>
            </div>
            <div class="add-form-content">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="add-txt" placeholder="网址名称">
                </div>
                <div class="form-group">
                    <label>外网URL</label>
                    <input type="text" id="add-url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>内网URL</label>
                    <input type="text" id="add-purl" placeholder="http://内网地址...">
                </div>
            </div>
            <div class="add-form-footer">
                <button class="form-button cancel-btn">取消</button>
                <button class="form-button submit-btn">添加</button>
            </div>
        </div>
    </div>
    
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    
<script src="webguide.js"></script>
</body>
</html>
